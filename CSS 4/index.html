<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .box{ 
        background-color: lightblue;
    }
    .box1{
        color: red;
        padding: 20px;
        margin: 20px;
        border: 10px solid blue;
        height: 200px;
        box-sizing: border-box;
    }
    .box2{
        color: green;
         padding: 20px;
        margin: 20px;
        border: 10px solid blue;
        height: 200px;
        box-sizing: border-box;
    }
</style>
<body>
    <div class="box box1"> I am a box</div>
    <div class="box box2"> I am a box's box</div>
</body>
